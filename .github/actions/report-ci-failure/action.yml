name: Report an unattended CI failure
description: >
  Turn the outcome of an unattended workflow run into a single open issue, so a
  red scheduled run is visible without anyone sweeping the Actions tab.

# Why this exists
#
# `lockfile refresh` ran weekly and failed on every run from 7 Sep 2026 to
# 5 Oct 2026 — six consecutive runs, which is every run it has ever had. Nothing
# reported it. It was found by sweeping failed runs across every repository by
# hand, four weeks later, and by then the stale lockfiles it could not deliver
# had made two `security` jobs red as well.
#
# A scheduled run has no pull request to turn red and nobody watching the tab,
# so its failure is indistinguishable from its success from anywhere a person
# actually looks. This action moves that signal somewhere people read: an open
# issue means a scheduled workflow is currently failing, and the issue closes
# itself when the workflow goes green again. The issue IS the state, which is
# why both outcomes do work here — a marker that only ever goes on accumulates
# into a list nobody trusts.
#
# Identity is the workflow FILE, carried in an HTML comment in the issue body,
# not the issue title. `github.workflow` is a mutable display name: renaming a
# workflow with an issue open would otherwise orphan it, and two workflows
# sharing a display name would open and close each other's.

inputs:
  needs:
    description: >
      `toJSON(needs)` from the calling job. The calling job must `needs:` every
      job whose outcome should count, and must itself run under `if: always()`.
    required: true
  workflow:
    description: The workflow's display name. Used in the issue title, for humans.
    required: true
  workflow-ref:
    description: >
      `github.workflow_ref`. The file path inside it is the issue's real
      identity, so a rename of the display name does not orphan an open issue.
    required: true
  token:
    description: "A token carrying `issues: write`."
    required: true
  label:
    description: >
      The label that marks these issues. The action creates it if it is missing,
      so a label deleted from the repository does not stop a report being filed.

      Note what that does NOT cover: the label is also how the lookup is scoped,
      so a label removed by hand from an open report makes that report invisible
      to this action. It will not be commented on and it will not be closed. The
      issue body says not to hand-close these, and not to unlabel them for the
      same reason.
    required: false
    default: ci-failure
  triage-labels:
    description: >
      Extra labels applied when the issue is first created, so it is triaged in
      the same command. If any of them is missing or renamed the issue is still
      filed, with only `label`, and a warning names what was dropped — filing
      matters more than filing it tidily.
    required: false
    default: bug,P2

runs:
  using: composite
  steps:
    - name: Open, update or close the failure issue
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        WORKFLOW: ${{ inputs.workflow }}
        WORKFLOW_REF: ${{ inputs.workflow-ref }}
        LABEL: ${{ inputs.label }}
        TRIAGE_LABELS: ${{ inputs.triage-labels }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EVENT: ${{ github.event_name }}
        RUN_NUMBER: ${{ github.run_number }}
        REF: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        LIST_LIMIT=100

        # Create the marker label if it is missing. An earlier version relied on
        # it existing and described a deleted label as "failing loudly" — but
        # loudly here means a red job in the Actions tab, which is exactly the
        # signal this action exists because nobody reads. `--force` is
        # idempotent and needs only the `issues: write` this job already holds.
        # Create it only when it is absent. `--force` unconditionally would
        # rewrite the colour and description on every run, reverting anybody who
        # had tuned them.
        if have_label=$(gh label list --repo "$REPO" --limit 200 --json name \
                          -q '.[].name' 2>&1); then
          if ! printf '%s\n' "$have_label" | grep -qxF "$LABEL"; then
            if ! out=$(gh label create "$LABEL" --repo "$REPO" --color b60205 \
                         --description "A scheduled workflow is currently failing" 2>&1); then
              echo "::warning::could not create the ${LABEL} label (${out}). If it" \
                   "is missing, filing below will fail and a red job in the Actions" \
                   "tab will be the only signal — which is the signal nobody reads."
            fi
          fi
        else
          echo "::warning::could not list labels (${have_label}), so this run" \
               "cannot tell whether ${LABEL} exists."
        fi

        # `github.workflow_ref` looks like
        #   owner/repo/.github/workflows/security.yml@refs/heads/main
        # Strip the owner/repo prefix and the @ref suffix to get the path.
        # Split at `@refs/`, which is the one delimiter that is always right.
        # `workflow_ref` is `{owner}/{repo}/{path}@{ref}` and the ref always
        # starts with `refs/`. Splitting at the LAST `@` breaks on a branch
        # containing one (`refs/heads/release@2026` is legal); splitting at the
        # FIRST `@` breaks on a filename containing one, which would give
        # `audit@daily.yml` and `audit@weekly.yml` a single shared identity and
        # let a green run of one close the other's failure issue.
        wf_file=${WORKFLOW_REF%%@refs/*}
        wf_file=${wf_file#*/*/}
        # Assert the shape we actually require, rather than "the string changed":
        # `#*/*/` rewrites any input with two slashes, so comparing against the
        # original passed a ref with no `@refs/` in it at all.
        case "$WORKFLOW_REF" in
          */*/*@refs/*) ;;
          *)
            echo "::error::workflow-ref '${WORKFLOW_REF}' is not of the form" \
                 "owner/repo/path@refs/..., so the workflow file path cannot be" \
                 "read out of it. Without that this action cannot identify its own" \
                 "issue, and guessing would act on somebody else's."
            exit 1 ;;
        esac
        if [ -z "$wf_file" ]; then
          echo "::error::could not read a workflow file path out of" \
               "workflow-ref '${WORKFLOW_REF}'. Without it this action cannot" \
               "identify its own issue, and guessing would act on somebody else's."
          exit 1
        fi
        marker="<!-- report-ci-failure: ${wf_file} -->"
        # A second marker recording which run last found this workflow red.
        #
        # Known limit, stated because the ordering below does NOT cover it: a
        # green run that finishes BEFORE an older red run files leaves an issue
        # open while the workflow's newest verdict is green. A green run writes
        # no marker, so there is nothing for the later red run to compare
        # against. It self-corrects on the next green run — a week, on the cron.
        # Closing it properly would mean recording the last green run too, which
        # is more machinery than the window deserves.
        # Serialisation was removed (see the note beside the reporter jobs), so
        # two runs can overlap, and without an order an OLDER run reaching its
        # green path can close the issue a NEWER red run just opened — leaving
        # the latest state red with nothing open. `run_number` is monotonic per
        # workflow, so it is the order. The failure path writes it; the green
        # path refuses to close anything a higher-numbered run reported.
        run_marker_prefix="<!-- report-ci-failure-run: "
        run_marker="${run_marker_prefix}${RUN_NUMBER} -->"

        # An empty `needs` object means this job could not see any result, not
        # that every job passed. Reporting green off an empty answer sheet is
        # the exact failure this action exists to prevent, so refuse instead.
        #
        # Every step of reading it has to refuse too. `jq` on empty input exits
        # 0 and prints nothing, so `count` comes back as the empty string; and
        # `[ "" -eq 0 ]` inside an `if` returns status 2, which `set -e` does
        # NOT treat as fatal, so the guard silently does not fire and the run
        # proceeds to the green path — closing a real failure issue. A count
        # that is not a number is "I could not read this", so it is checked as
        # a number before it is used as one.
        if ! printf '%s' "$NEEDS" | jq -e 'type == "object"' >/dev/null 2>&1; then
          # Do NOT write the braced form of an Actions expression anywhere in
          # this script. The runner substitutes those in the `run:` text before
          # bash ever sees it, and a backslash does not escape one.
          #
          # What was OBSERVED: an earlier version contained the braced spelling
          # of a `toJSON(needs)` expression inside this message. What follows is
          # inferred, not measured, and both outcomes are bad. If `needs` does
          # not resolve in a composite-action context, template evaluation fails
          # and the step dies on every run before any of it executes. If it does
          # resolve, multi-line JSON is spliced into the script source and its
          # own quotes unbalance the surrounding quoting — in the one job in the
          # repository holding `issues: write`. Neither was reproduced on a
          # runner; the braces were simply removed.
          echo "::error::the needs input is not a JSON object. Got: '${NEEDS}'." \
               "The calling job must pass the toJSON(needs) expression as the" \
               "needs input; without it this run's outcome is unknown, which is" \
               "not the same as passing."
          exit 1
        fi
        case "${RUN_NUMBER:-}" in
          ''|*[!0-9]*)
            echo "::error::run-number is not a number (got '${RUN_NUMBER:-}')." \
                 "It is how two overlapping runs are ordered, so without it this" \
                 "action cannot tell a stale verdict from a current one."
            exit 1 ;;
        esac

        count=$(printf '%s' "$NEEDS" | jq -r 'length')
        case "$count" in
          ''|*[!0-9]*)
            echo "::error::could not count the job results (got '${count}')." \
                 "Refusing rather than reading an unreadable answer as a pass."
            exit 1 ;;
        esac
        if [ "$count" -eq 0 ]; then
          echo "::error::report-ci-failure got no job results. The calling job is" \
               "missing its needs: list, so this run's outcome is unknown — which" \
               "is not the same as passing."
          exit 1
        fi

        # Every entry must carry a result this action actually understands. A
        # missing or unrecognised one is "I could not read this", and the one
        # thing it must not become is a green verdict: that would close an open
        # failure issue and report the workflow healthy.
        unreadable=$(printf '%s' "$NEEDS" \
          | jq -r '[ to_entries[]
                     | if (.value | type) != "object" then
                         "`" + .key + "` -> not an object (" + (.value | type) + ")"
                       elif (.value.result | IN("success","failure","cancelled","skipped")) != true then
                         "`" + .key + "` -> " + ((.value.result // "no result field") | tostring)
                       else
                         empty
                       end ]
                   | join(", ")')
        if [ -n "$unreadable" ]; then
          echo "::error::unrecognised job result(s): ${unreadable}. Refusing rather" \
               "than treating a result this action cannot read as a pass."
          exit 1
        fi

        # `skipped` is not a failure: a job gated on github.event_name is
        # legitimately absent on the other event. `cancelled` IS counted — a
        # cancelled weekly run delivered nothing, which is the thing we are
        # trying to stop being invisible.
        failed=$(printf '%s' "$NEEDS" \
          | jq -r 'to_entries
                   | map(select(.value.result == "failure" or .value.result == "cancelled"))
                   | map("- `" + .key + "` — " + .value.result)
                   | join("\n")')

        title="CI: \`${WORKFLOW}\` is failing on its unattended runs"

        # Find our own open issue by the marker in its body. Title matching
        # would break on a workflow rename and would collide between two
        # workflows sharing a display name.
        if listing=$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
                       --limit "$LIST_LIMIT" --json number,body 2>&1); then
          if ! printf '%s' "$listing" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::the ${LABEL} listing is not a JSON array. Got:" \
                 "'${listing}'. Refusing rather than reading it as 'no issues'."
            exit 1
          fi
          # EVERY match, not the first. A lookup failure on an earlier run is
          # allowed to leave a duplicate (filing beats silence), so the green
          # path has to be able to clear more than one or the extra stays open
          # for ever while the workflow is green.
          existing=$(printf '%s' "$listing" \
            | jq -r --arg m "$marker" '[ .[] | select(.body != null and (.body | contains($m))) ]
                                       | sort_by(.number) | .[].number')
          returned=$(printf '%s' "$listing" | jq -r 'length')
          case "$returned" in
            ''|*[!0-9]*)
              echo "::error::could not count the ${LABEL} listing (got '${returned}')." \
                   "Refusing rather than assuming it was short."
              exit 1 ;;
          esac
          if [ "$returned" -ge "$LIST_LIMIT" ]; then
            # A full page means our issue may be on the next one. That is "I
            # could not look" wearing a successful exit code.
            echo "::warning::the open-${LABEL} listing filled its ${LIST_LIMIT}-row page," \
                 "so an existing issue may not have been in it."
            looked=no
          else
            looked=yes
          fi
        else
          # "I could not look" is not "there is none". The failure path below
          # still files, because a visible duplicate is recoverable and silence
          # is the thing being fixed, and the step then exits non-zero so the
          # bad lookup is on record rather than absorbed.
          echo "::warning::could not list existing ${LABEL} issues: ${listing}"
          existing=""
          looked=no
        fi

        if [ -n "$failed" ]; then
          body=$(printf '%s\n' \
            "${marker}" \
            "${run_marker}" \
            "" \
            "The \`${WORKFLOW}\` workflow failed on an unattended \`${EVENT}\` run of" \
            "\`${REF}\`, and no pull request carries that signal, so this issue is the" \
            "signal." \
            "" \
            "**Failing jobs**" \
            "" \
            "${failed}" \
            "" \
            "**Run:** ${RUN_URL} (event \`${EVENT}\`, ref \`${REF}\`)" \
            "" \
            "**What to do:** open the run, read the first failing step, and either fix" \
            "it or reply here saying why it is expected. Do not close this by hand while" \
            "the workflow is still red — the next green run closes it, and a hand-closed" \
            "issue silently stops being the state. The exception: if a green run reports" \
            "that it could not order this issue against itself, it will never close it" \
            "automatically, and closing it by hand is then the right thing to do." \
            "Do not remove the \`${LABEL}\` label" \
            "either: it is how this issue is found, so without it the next green run" \
            "cannot close this and the next red one opens a second." \
            "" \
            "**Who is affected and why now:** reason 3. A weekly job's failure is" \
            "invisible for a week at a time; the failure that produced this mechanism" \
            "went six runs and four weeks before a manual sweep found it, and by then it" \
            "had taken the dependency audit down with it." \
            "" \
            "<sub>Filed by \`.github/actions/report-ci-failure\` for \`${wf_file}\`.</sub>")

          if [ -n "$existing" ]; then
            # Comment on the oldest match only — one report per run, whatever
            # duplicates a past lookup failure left behind. The green path
            # closes all of them. "Oldest" needs the sort above: the listing
            # arrives newest-first, so an unsorted `head -n 1` is the newest.
            first=$(printf '%s\n' "$existing" | head -n 1)
            gh issue comment "$first" --repo "$REPO" --body "$body"
            echo "commented on #${first}"
            # Advance the recorded run number — forwards only, except that
            # read-then-edit is not atomic: two red runs reading the same marker
            # inside the same window can still land out of order. Overwriting it
            # unconditionally lets it go BACKWARDS: run 12 files marker 12, slow
            # run 10 then rewrites it to 10, and run 11's green path reads 10 < 11
            # and closes an issue whose newest verdict (12) is still red.
            # Guarded for the same reason the close loop is: unguarded under
            # `set -e` with `pipefail`, a transient API failure here would exit
            # the step with no annotation, after the comment had landed.
            if first_body=$(gh issue view "$first" --repo "$REPO" --json body -q .body 2>&1); then
              recorded=$(printf '%s' "$first_body" \
                         | sed -n "s|.*${run_marker_prefix}\([0-9]\{1,\}\) -->.*|\1|p" | head -n 1)
            else
              echo "::warning::could not read #${first} to compare run markers:" \
                   "${first_body}. Treating it as unmarked."
              recorded=""
            fi
            case "$recorded" in
              ''|*[!0-9]*) recorded=0 ;;
            esac
            if [ "$recorded" -gt "$RUN_NUMBER" ]; then
              echo "::notice::#${first} already records run ${recorded}, newer than" \
                   "this run ${RUN_NUMBER}. Leaving its marker alone."
            elif ! gh issue edit "$first" --repo "$REPO" --body "$body" >/dev/null; then
              echo "::warning::could not update the run marker on #${first}. An" \
                   "older overlapping run may now close this while it is still red."
            fi
            others=$(printf '%s\n' "$existing" | tail -n +2 | tr '\n' ' ')
            [ -n "${others// /}" ] && echo "::warning::duplicate open issues for" \
              "${wf_file}: ${others}— they will all be closed on the next green run."
          else
            # Triaged in the same command that creates it: an untriaged issue is
            # unreadable and inflates the count. No --milestone — a milestone
            # title hardcoded here breaks this notifier the day somebody renames
            # or closes it, and a notifier that cannot file is the original bug
            # wearing a different hat.
            extra=()
            IFS=',' read -r -a parsed <<< "$TRIAGE_LABELS"
            for l in "${parsed[@]}"; do
              [ -n "$l" ] && extra+=(--label "$l")
            done

            if url=$(gh issue create --repo "$REPO" --title "$title" --body "$body" \
                       --label "$LABEL" "${extra[@]}" 2>&1); then
              echo "opened ${url}"
            else
              # The triage labels are secondary; the issue existing is not. Retry
              # with only the marker label and say loudly what was dropped, so a
              # renamed label cannot turn this back into silence.
              echo "::warning::could not file with triage labels (${TRIAGE_LABELS}):" \
                   "${url}. Retrying with only ${LABEL} — the issue needs triaging by hand."
              url=$(gh issue create --repo "$REPO" --title "$title" --body "$body" \
                      --label "$LABEL")
              echo "opened ${url} (untriaged)"
            fi
          fi

          if [ "$looked" = no ]; then
            echo "::error::the report landed, but the duplicate check could not run," \
                 "so there may now be two open issues for this workflow."
            exit 1
          fi
          exit 0
        fi

        # Green.
        #
        # Only a run on the default branch may CLOSE a report: a green run off a
        # feature branch carries a HIGHER run number than the default branch's
        # failing scheduled run, so without this it would win the ordering
        # comparison and clear a real failure. Filing is NOT restricted — a
        # failure anywhere is worth knowing about.
        #
        # The branch is asked of the API rather than read from
        # `github.event.repository.default_branch`. That field comes from a
        # webhook payload, and a `schedule` run has no webhook behind it, so it
        # may be empty on exactly the runs that matter most — which would have
        # meant no scheduled run could ever close anything, and a red reporter on
        # every green cron run. This lookup needs only the `contents: read` this
        # job already holds and does not depend on a payload shape.
        if ! DEFAULT_BRANCH=$(gh repo view "$REPO" --json defaultBranchRef \
                                -q .defaultBranchRef.name 2>&1); then
          echo "::error::could not read the default branch (${DEFAULT_BRANCH})." \
               "Refusing rather than clearing a report that may belong to another" \
               "branch."
          exit 1
        fi
        if [ -z "$DEFAULT_BRANCH" ]; then
          echo "::error::the default branch came back empty, so this run cannot" \
               "tell whether it may close anything. Refusing."
          exit 1
        fi
        if [ "$REF" != "$DEFAULT_BRANCH" ]; then
          # A green run off the default branch says nothing about the branch the
          # weekly cron runs on, and it carries a HIGHER run number, so without
          # this it would win the ordering comparison and clear a real failure.
          echo "::notice::green, but this run is on '${REF}' and only" \
               "'${DEFAULT_BRANCH}' may close a report. Leaving any open issue alone."
          exit 0
        fi

        # Close the issue so an open one always means "currently red".
        #
        # Close what was actually found even when the lookup was partial. An
        # earlier version exited here first, so a truncated listing left every
        # match it HAD found open — while a comment two files away claimed the
        # green path closes every matching issue. Do the work, then report that
        # the sweep was incomplete.
        unresolved=0
        if [ -n "$existing" ]; then
          # The loop runs in a subshell because of the pipe, so it reports back
          # through a file rather than a variable.
          unresolved_file=$(mktemp)
          printf '%s\n' "$existing" | while read -r n; do
            [ -n "$n" ] || continue
            # Refuse to close a report from a higher-numbered run: that run is
            # newer than this one and its verdict is the current one.
            # Wrapped in `if`: `set -e` plus `pipefail` would otherwise kill the
            # loop on a transient API failure, the outer pipeline would return
            # non-zero, and the script would exit before printing anything or
            # removing the temp file. "I could not read this one" belongs in the
            # unresolved tally like any other unreadable marker.
            if ! issue_body=$(gh issue view "$n" --repo "$REPO" --json body -q .body 2>&1); then
              echo "::warning::could not read #${n} to order it against this run:" \
                   "${issue_body}. Leaving it open."
              echo x >> "$unresolved_file"
              continue
            fi
            opener=$(printf '%s' "$issue_body" \
                     | sed -n "s|.*${run_marker_prefix}\([0-9]\{1,\}\) -->.*|\1|p" | head -n 1)
            case "$opener" in
              ''|*[!0-9]*)
                # Not "leave it and call the run clean": this is the action
                # unable to tell a current verdict from a stale one, on an issue
                # it is supposed to own. Leaving it open is the safe direction;
                # exiting zero afterwards would not be.
                echo "::warning::#${n} carries no readable run marker, so this run" \
                     "cannot tell whether it is newer. Leaving it open."
                # Say it on the issue too. An error in a reporter job's log sits
                # in the Actions tab, which is the place this action exists
                # because nobody reads it. A comment is where the reader is.
                #
                # Built with printf and indented: a bare multi-line string here
                # leaves the YAML block scalar and breaks the whole file.
                nudge=$(printf '%s\n' \
                  "Run ${RUN_NUMBER} of \`${wf_file}\` was green, but could not order" \
                  "itself against this issue: the issue carries no readable run" \
                  "marker, so this run cannot tell whether its own verdict is the" \
                  "current one. It has been left open deliberately." \
                  "" \
                  "If \`${wf_file}\` is green now, close this by hand. A later red run" \
                  "would re-mark it and a green run could then close it, but nothing" \
                  "else will close it as it stands.")
                gh issue comment "$n" --repo "$REPO" --body "$nudge" >/dev/null 2>&1 \
                  || echo "::warning::could not comment on #${n} either."
                echo x >> "$unresolved_file"
                continue ;;
            esac
            if [ "$opener" -gt "$RUN_NUMBER" ]; then
              # Not an error: a newer run holding the verdict is the ordering
              # working as designed.
              echo "::notice::#${n} was reported by run ${opener}, newer than this" \
                   "run ${RUN_NUMBER}. Leaving it open — that run's verdict is current."
              continue
            fi
            if ! out=$(gh issue close "$n" --repo "$REPO" \
                 --comment "Green again on ${RUN_URL}. Closed by \`.github/actions/report-ci-failure\`." 2>&1); then
              echo "::warning::could not close #${n}: ${out}. Leaving it open."
              echo x >> "$unresolved_file"
              continue
            fi
            echo "closed #${n}"
          done
          unresolved=$(wc -l < "$unresolved_file" | tr -d ' ')
          rm -f "$unresolved_file"
        fi

        if [ "${unresolved:-0}" -gt 0 ]; then
          echo "::error::${unresolved} open issue(s) for ${wf_file} could not be" \
               "ordered against this run, so they were left open, and this run is" \
               "not reported as clean. WHAT TO DO: open each one, confirm the" \
               "workflow is actually green now, and close it by hand. A later RED" \
               "run writes a marker onto the oldest unmarked issue, after which a" \
               "green run can close that one itself — but anything this run could" \
               "not read stays open until somebody looks. Each affected issue has" \
               "a comment saying the same thing."
          exit 1
        fi

        if [ "$looked" = no ]; then
          echo "::error::this run was green and closed what it found, but the lookup" \
               "was partial, so a stale failure issue may still be open. Not" \
               "reporting that as clean."
          exit 1
        fi

        if [ -z "$existing" ]; then
          echo "green, and no open ${LABEL} issue for ${wf_file}. Nothing to do."
        fi
