name: security

# Supply-chain hygiene + wire-parser fuzzing. Runs on every PR, every
# push to main, and on a weekly cadence so a vulnerability that lands in
# a transitive dep between commits doesn't sit unnoticed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:17 UTC every Monday. Slightly off the hour to avoid piling on
    # GitHub's cron runners at the top of the hour.
    - cron: "17 6 * * 1"
  # So the weekly sweep can be re-run on demand after a fix lands, instead of
  # waiting until Monday to find out — and so the failure reporter below has a
  # path that can actually be exercised.
  workflow_dispatch:

# Minimum GITHUB_TOKEN perms. CodeQL flagged the absence as
# `actions/missing-workflow-permissions`; every job in this workflow
# only needs read access (checkout + pip-audit + hypothesis fuzz).
permissions:
  contents: read

jobs:
  lockfile-drift:
    name: lockfiles match their requirements
    runs-on: ubuntu-latest
    # Dependabot's pip-compile support only looks at generated files named
    # *.txt, and ours are requirements.lock / requirements-dev.lock. So it
    # bumps a floor in requirements*.txt and leaves the pin behind, and the
    # first thing to notice is an unrelated PR failing pip-audit for a
    # package it never touched. Catch the drift where it happens instead.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packaging
        run: pip install packaging

      - name: Check lockfiles against declared requirements
        run: python scripts/check_lockfile_consistency.py

  pip-audit:
    name: pip-audit (lockfiles + environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit runtime lockfile
        # --strict fails the job on ANY finding (not just HIGH/CRITICAL).
        # We pin hashes, so a finding means "a dep we shipped has a CVE"
        # and demands attention regardless of severity. Adjust scope
        # later if we want to gate only on HIGH/CRITICAL.
        run: pip-audit -r requirements.lock --strict

      - name: Audit dev lockfile
        run: pip-audit -r requirements-dev.lock --strict

      - name: Install dependencies from the hashed lockfile
        # Use the lockfile as the source of truth so the audited
        # dependency set is byte-identical to what CI executes. A plain
        # `.[dev]` install would resolve from PyPI at job time and drift
        # from the just-audited set; --require-hashes makes drift
        # impossible.
        #
        # Deliberately do NOT `pip install -e .` here: the local `dmp`
        # package is what we're shipping, not a third-party dependency,
        # so it doesn't belong in the vuln audit. Including it (even
        # with --skip-editable) makes pip-audit --strict fail on the
        # skip itself. Fuzz / test jobs install -e separately when they
        # need the module importable.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Audit installed environment
        # Final drift check: confirms the audited lockfile is what's
        # actually resolvable in a fresh environment.
        #
        # CVE-2026-3219 is in pip itself on the GitHub runner toolchain;
        # no fix version has been published and pip is not in our lockfile,
        # so the environment audit flags it on every run. Revisit when
        # upstream ships a patched pip.
        run: pip-audit --strict --ignore-vuln CVE-2026-3219

  fuzz-wire-parsers:
    name: hypothesis fuzz (wire parsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install from the hashed lockfile
        # Source-of-truth install: the lockfile is what pip-audit
        # approves, so fuzz/nightly jobs run against the exact
        # dependency set we reviewed.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run fuzz harness
        # PR + push budget: 500 examples per property (fast; seconds, not
        # minutes). The weekly scheduled run below ramps it up to 5000.
        run: pytest tests/fuzz/ -v

  fuzz-wire-parsers-nightly:
    name: hypothesis fuzz — extended
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install from the hashed lockfile
        # Source-of-truth install: the lockfile is what pip-audit
        # approves, so fuzz/nightly jobs run against the exact
        # dependency set we reviewed.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run fuzz harness (extended)
        env:
          # Picked up by tests/fuzz/conftest.py to widen `max_examples`
          # on the weekly cron run. PR CI leaves it unset → default 500.
          DMP_FUZZ_MAX_EXAMPLES: "5000"
        run: pytest tests/fuzz/ -v

  report:
    name: report an unattended failure
    # Every job above, so one run produces one verdict. Putting the reporter
    # inside each job instead would race: `fuzz` going green would close the
    # issue `pip-audit` had just opened in the same run.
    needs:
      - lockfile-drift
      - pip-audit
      - fuzz-wire-parsers
      - fuzz-wire-parsers-nightly
    # See the matching job in lockfile-refresh.yml, which carries the reasoning.
    # PR and push failures are already visible on the thing that caused them;
    # only the unattended runs need somewhere to be seen.
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Deliberately NOT serialised with `concurrency:`. An earlier version was,
    # to stop two overlapping runs both finding no issue and both creating one.
    # Two things make that the wrong trade. The green path now closes EVERY
    # matching issue, so a duplicate reconciles itself on the next green run.
    # And GitHub keeps at most one PENDING member per concurrency group, so a
    # third run arriving can supersede a queued reporter even with
    # `cancel-in-progress: false` — and a cancelled reporter files NOTHING.
    # A duplicate issue is noise somebody can see; an unfiled failure is the
    # bug this exists to remove, so the race is the safer side to be on.
    permissions:
      # `contents: read` is required, not tidiness: a `permissions` block sets
      # every unlisted scope to `none`, which would strip `actions/checkout` of
      # its token and stop the reporter running at all.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/report-ci-failure
        with:
          needs: ${{ toJSON(needs) }}
          workflow: ${{ github.workflow }}
          workflow-ref: ${{ github.workflow_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
